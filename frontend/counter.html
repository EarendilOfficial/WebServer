<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Earendil | UPDATE</title>
    <link href="/plantilla.css" rel="stylesheet">
    <link rel="stylesheet" href="/pages/counter/style.css">
</head>
<body>

    <div class="scanlines"></div>

    <main class="main-container">
        <section style="display: flex;">
            <img src="/resources/icons/logo/earendil_Logo.png" alt="Logo Earendil" class="main-logo">
        </section>

        <header class="header">
            <div class="badge">PRÓXIMA ACTUALIZACIÓN!!</div>
            <h1 class="event-title">EL ROBO DE LOS ELFOS DURMIENTES</h1>
        </header>

        <section class="ip-section">
            <p class="label">DIRECCIÓN DEL SERVIDOR:</p>
            <div class="ip-card" onclick="copiarIP()" id="server-ip">
                <span class="ip-text">chamiserv77.ddns.net</span>
                <span class="copy-hint">¡CLIC PARA COPIAR!</span>
            </div>
        </section>

        <section class="timer-section">
            <h2 class="timer-label">EL PORTAL SE ABRE EN:</h2>
            <div id="timer" class="timer-grid">
                <div class="time-block">
                    <span id="dias" class="number">00</span>
                    <span class="label">DÍAS</span>
                </div>
                <div class="separator">:</div>
                <div class="time-block">
                    <span id="horas" class="number">00</span>
                    <span class="label">HRS</span>
                </div>
                <div class="separator">:</div>
                <div class="time-block">
                    <span id="minutos" class="number">00</span>
                    <span class="label">MIN</span>
                </div>
                <div class="separator">:</div>
                <div class="time-block">
                    <span id="segundos" class="number">00</span>
                    <span class="label">SEG</span>
                </div>
            </div>
        </section>

        <footer class="current-event">
            <p class="label">EVENTO ACTUAL:</p>
            <div class="event-banner">
                <span class="pulse-icon"></span>
                <h3 class="event-name">Bombardeo INSANO</h3>
            </div>
        </footer>
    </main>

    <div class="music-widget" onclick="toggleMusic()">
        <div class="music-visualizer">
            <span></span><span></span><span></span>
        </div>
        <span id="music-status">MUSIC: OFF</span>
    </div>

    <audio id="bg-music" loop>
        <source src="/resources/music/theme.mp3" type="audio/mpeg">
    </audio>

    <script src="/pages/counter/script.js"></script>
</body>
</html>
